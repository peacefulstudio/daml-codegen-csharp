name: Finalize Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version whose draft release to publish (no leading v, e.g. 0.4.0-preview.4).'
        required: true
        type: string

jobs:
  finalize:
    permissions:
      contents: write
    uses: ./.github/workflows/_release-lifecycle.yaml
    with:
      action: finalize
      tag: v${{ inputs.version }}
